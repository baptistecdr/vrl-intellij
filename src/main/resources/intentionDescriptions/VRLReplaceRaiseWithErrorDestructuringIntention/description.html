<body>
Rewrites <code>target = f!(...)</code> as <code>target, err = f(...)</code>, so a failure is
captured in a variable instead of aborting the program. The error variable is named
<code>err</code>, or <code>err1</code>, <code>err2</code>, ... if that name is already in scope.
</body>
