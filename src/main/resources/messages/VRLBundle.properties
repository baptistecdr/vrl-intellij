inlay.hints.type.name=Assigned value types
inlay.hints.type.description=Shows the return type of a directly-assigned function call, e.g. "x: string = parse_json(...)". For error-destructuring assignments ("value, err = ..."), the error target is annotated as "error".
inlay.hints.parameterNames.name=Parameter names
inlay.hints.parameterNames.description=Shows each positional argument's parameter name for calls to functions with more than one parameter, e.g. "slice(., start: 0, end: 5)".
