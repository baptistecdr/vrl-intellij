name: Refresh VRL functions

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch:

jobs:
  refresh:
    name: Refresh VRL function metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0

      - name: Refresh function metadata from vector.dev
        run: node scripts/refresh-vrl-functions.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/main/kotlin/eu/bcosp/vrlintellij/functions/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21.0.13+9.0.LTS

      - name: Setup Gradle
        if: steps.diff.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test the regenerated metadata
        if: steps.diff.outputs.changed == 'true'
        run: ./gradlew build

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="refresh-vrl-functions-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/main/kotlin/eu/bcosp/vrlintellij/functions/
          git commit -m "Refresh VRL function metadata from vector.dev"
          git push origin "$branch"
          gh pr create \
            --title "Refresh VRL function metadata from vector.dev" \
            --body "Automated monthly refresh of function descriptions, argument types/defaults, and return types from https://vector.dev/docs/reference/vrl/functions/, generated by \`scripts/refresh-vrl-functions.mjs\`. \`./gradlew build\` passed against this change before the PR was opened - please review the diff for anything that looks like a parsing artifact rather than a real upstream change before merging." \
            --base main \
            --head "$branch" \
            --assignee baptistecdr
