name: Build

on:
  - push
  - pull_request

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v6.1.0
      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2
      - name: Build
        run: ./gradlew build
      - name: Test
        run: ./gradlew test
      - name: Build plugin distribution
        run: ./gradlew buildPlugin
      - name: Upload build artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: vrl-intellij-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
